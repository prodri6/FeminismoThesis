 en septiembre 2021. url url"], "2022": ["El matrimonio igualitario, el cupo laboral travesti trans, la identidad de genero y el DNI no binario, y tambien el hashtag aborto legal y los hashtag 1000 dias.\n\nDerechos y felicidad para millones. Que poco hacia falta, no? Pero costo muchisimos anos de lucha y transformacion. url", "hashtag mexico se pinta de colores: Tamaulipas es el estado 32 en aprobar el matrimonio igualitario url\n\nMismos derechos para tod@usuario las personas. \n\nEn clave local ahora tiene que aprobarse el hashtag aborto legal.", "Buenos dias de matrimonio igualitario  aprobado en Guerrero y aborto despenalizado en Quintana Roo.  hashtag sociedaddederechos. Que sea una gran semana. hashtag abortolegal hashtag matrimonio igualitario hashtag todoslosderechosparatodos url", "Por la maldita ley de hashtag aborto legal jamas hablo ni para que fuese derogada, por el matrimonio homosexual tampoco, por el hambre, la miseria y la pobreza menos, y por la farsa del covicho, se presto al juego del inoculado. Solo Dios puede juzgarlo y lo hara!\nurl", "@usuario @usuario @usuario @usuario Me pasa igual, no encajo con los chairos mucho menos con la derecha por que estoy a favor del hashtag abortolegal y el matrimonio igualitario entre otras cosas. (Por cierto, morena no es de izquierda)"]}}, "hombres": {"years": ["2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022"], "values": [0.10706586826347306, 0.05990330865689681, 0.03302308379819398, 0.031350618539230636, 0.023472436485773986, 0.01825491012345986, 0.01881439811324402, 0.023157605755488628, 0.026617765834776822, 0.028946098239942528, 0.02247823174815807, 0.023047845339669512, 0.026022164544276676], "examples": {"2010": ["hashtag aborto legal y Seguro Sumate y apoya el derecho a decidir de las Mujeres. y que los hombres no seamos machista al decidir por ellas .", "RT @usuario: hashtag dia internacionaldela mujer Procesan en hashtag df a 850 hombres por manos al pero no es el momento d instalar el debate, no hay trabajo ,no alcanza para comer y las sras hablan d esto", "Gente q haceis ruido al comer..os odio a muerte. Ya esta, ya lo he dicho hashtag aborto legal", "hashtag abortolegal a vos que estas en contra, te quiero ver recorriendo villas dandole de comer a todos los bebes de adolescentes eh"], "2018": ["Cualquier cosa se llama cacatua tiene 36 anos y vive en banfield, basta de gente asi hashtag mira comos nos ponemos  hashtag aborto legal hashtag showmatch2018 bueno me voy a comer el choripan que se me enfria", "Mas que fresco, pero con un calor violeta y verde inolvidable. Recien para la media noche pudimos comer algo. Adrenalina, emocion y lucha. Fue hermoso. Fue con ellas y tantas en las calles. hashtag 13 j hashtag aborto legal url", "@usuario ah ahora no se me puede antojar comer tierra porque estoy embarazado? \nhashtag aborto legal", "En Mandarine Park te venden golpiza y amenazas de muerte por llevar el panuelo verde. Las pibas del Pelle la vivieron en carne propia. Dejemos de darle de comer a estos lugares del odio y hashtag pro muerte. Exigimos justicia. hashtag aborto legal\n\nurl", "@usuario @usuario @usuario @usuario @usuario @usuario @usuario @usuario @usuario @usuario @usuario @usuario Toda esa gente que esta en contra del aborto me imagino que dan de comer a los ninos en las calles, les dan ropa o los adoptan.. prefieren ver un nino pasando mil necesidades  a eso le llaman VIDA ??? hashtag aborto legal"], "2019": ["La mujer que sabe lo que trae a la mesa, no siente miedo de comer sola hashtag go hashtag girl power hashtag empowerment hashtag empoderamiento hashtag 8marzo hashtag juntas wisewomenchile en Santiago, Chile url", "Cuando sientan q nadie los quiere acuerdense de mi q hoy es mi cumple y ni mi mama ni mi papa van a venir a comer torta hashtag aborto legal una bala en la rodilla dolia menos", "Hoy es el hashtag dia mundial de la infancia y seria realmente muy bueno q los q no quieren una has     const selector = document.getElementById("selector");

    Object.keys(DATA).forEach(word => {

        const option = document.createElement("option");

        option.value = word;

        option.text = word;

        selector.appendChild(option);

    });

    function update(word) {

        Plotly.newPlot(

            "chart",

            [{
                x: DATA[word]["years"],
                y: DATA[word]["values"],
                mode: "lines+markers",
                type: "scatter"
            }],

            {
                title: word,
                height: 500
            }

        );

        const examplesDiv = document.getElementById("examples");

        examplesDiv.innerHTML = "";

        const yearlyExamples = DATA[word]["examples"];

        Object.keys(yearlyExamples).forEach(year => {

            const block = document.createElement("div");

            block.className = "year";

            let html = `<h2>${year}</h2>`;

            const tweets = yearlyExamples[year];

            if (tweets.length === 0) {

                html += "<p>No examples.</p>";

            } else {

                tweets.forEach(tweet => {

                    html += `
                        <div class="tweet">
                            • ${tweet}
                        </div>
                    `;

                });

            }

            block.innerHTML = html;

            examplesDiv.appendChild(block);

        });

    }

    selector.addEventListener(
        "change",
        function() {
            update(this.value);
        }
    );

    update(Object.keys(DATA)[0]);

    </script>
