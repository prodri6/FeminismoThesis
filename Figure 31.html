..\nEl hashtag 8marzo gritaban igualdad... todos queremos igualdad ante la ley...\nNo esta bueno confundimos!"], "2020": ["HACIA EL 8 DE MARZO\nRita Segato, feminista cuyas tesis inspiraron \nUN VIOLADOR EN TU CAMINO\n\"La violacion no es un acto sexual,\nes un acto de poder,\nde dominacion,\nes un acto politico\"\nurl\nhashtag ni una menos\nhashtag vivas nos queremos \nhashtag 8 marzo \nhashtag aborto legal2020\n@usuario", "hashtag viva el8 m \nhashtag vivas nos queremos\nhashtag 8 marzo  \n\nEl feminismo es una ideologia totalitaria supremacista ginecocentrica de profundo desprecio a la vida, a la familia y al hombre.  El feminismo es fanatismo sexual y utilitarismo politico, con un absoluto desprecio a los derechos humanos.", "Aqui va la primera foto de la exposicion que no pudimos terminar de montar este 8 de marzo. No queremos que os quedeis sin verla. Gracias a tod@usuario l@usuario profes y alumn@usuario que se implicaron! @usuario  hashtag fp hashtag 8marzo url", "Captura d mi cuenta suspendida:\n\"Vigilias,manifestaciones y concentraciones con motivo d hashtag 8 marzo2020 q supongan reunion d mas d 100 personas deben ser PROHIBIDAS de forma terminante en territorio por Autoridades Sanitarias si no queremos un colapso d Servicios Sanitarios hashtag 8 marzo\" url", "hashtag el dedo en la llaga\n@usuario aprobo una minuta que incluye 6 hashtag reformas a diferentes hashtag leyes para aplicar sanciones contra la hashtag violencia a hashtag mujeres, dijo @usuario\nhashtag mesa de analisis hashtag 8 marzo hashtag un dia sin mujeres hashtag vivas las queremos\nEscucha el hashtag podcast en hashtag spotify"], "2021": ["Concentracion Woman in Black del grupo de igualdad de hashtag cgt de ayer viernes 18, 20:30 h, Plaza de Portugalete  hashtag vivas nos queremos  hashtag luchafeminista hashtag 8 marzo\n url", "Celebrando el dia de la mujer esta semana, nos fijamos en las palabras: palabras que no queremos volver a escuchar hashtag ieslatorretaelda hashtag palabrasquematan hashtag 8marzo hashtag diadelamujer hashtag niunamenos url", "La Cuarta Transformacion sera feminista o no sera...al parecer no sera.\nhashtag puesnosera hashtag yacholeconmorena hashtag dastristezayverguenza hashtag unvioladornoseragobernador hashtag ni una menos hashtag ni una mas hashtag mexico feminicida hashtag 8 marzo2021 hashtag 8 marzo hashtag vivas nos queremos", "Basta a la violencia  vivas las queremos!\n\nPor nuestras madres, hermanas, hijas y todas las mujeres en nuestras vidas\n\nhashtag 8 m  hashtag 8demarzo  hashtag 8marzo hashtag 8march hashtag marchafeminista  hashtag marcha8de marzo hashtag 8 m2021 hashtag 8 de marzo2021 hashtag 8 marzo2021 url", "hashtag me cae que no entienden... solo queremos hacer visible una desigualdad que ha impedido el avance y la construccion de la sociedad en conjunto.\nGenera violencia, miedo, enojo, y hashtag nos duele atodos hashtag podemos proteger a las hashtag mujeres que vienen.\nhashtag 8 marzo hashtag civismo yparticipacion democratica"], "2022": ["hashtag sheinbaum corrupta no queremos que nos pidas disculpas hashtag rebsamen hashtag linea12 no se olvida y gases lacrimogenos hashtag 8marzo te queremos en el penal hashtag sheinbaum al penal", "Libres somos\nLibres nos queremos y nadie podra detenernos.\n\nhashtag ipnveracruz\nhashtag ciitared genero hashtag 8 m hashtag dia de la mujer hashtag somos feministas hashtag feminismo hashtag fuerza mujeres\nhashtag 8 m2022 hashtag 8marzo hashtag 8marzo2022 url", "hashtag 8 marzo | Ayer terminamos nuestra particular semana del hashtag 8 m con homenajes a mujeres creativas. \nEstamos muy contentos por la acogida que ha tenido, y por eso queremos agradecer a todos y todas vuestra colaboracion en esta interesante actividad. \nMuchas gracias Companer@usuario!  url", "Este ano hashtag 8marzo distinto de reflexion, de conversa y obvio de marcha pacifica reiterando nuestro compromiso de seguir trabajando por una sociedad feminista. Luchando por terminar con la violencia, la desigualdad. Nos queremos juntas y vivas. Unidas somos mas  hashtag diadelamujer url", "Ya estas lista para este hashtag 8 marzo?\n\nEn todos los espacios este 8 de marzo conmemoramos la lucha de las mujeres. Te compartimos algunas ideas para exigir justicia y visualizar al patriarcado hashtag vivas nos queremos hashtag justicia para todas \n\n\nurl"]}}, "acompanamiento": {"years": ["2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022"], "values": [0.0, 0.0, 0.00010786821585970968, 0.0, 9.76390868792595e-05, 0.00013048097773745985, 0.00016915076649461617, 0.00018571301686758662, 0.0004419361884781648, 0.0006819100215517241, 0.00112822802708938, 0.001382438708283832, 0.0013417809626439794], "examples": {"2010": [], "2011": [], "2012": ["Harto interesante el trabajo de acompanamiento que hace La Lleca con los internos url hashtag educacion hashtag feminismo hashtag performance", "hashtag igualdad hashtag acceso justicia hashtag zacatecas impulsar implicacion ciudadana para orientacion y acompanamiento d mujeres en situacion de violencia", "Muchas gracias a @usuario y @usuario por su acompanamiento y cubrimiento a la jornada de hoy hashtag niuna mas @usuario @usuario", "Protocolos de acompanamiento para reducir la hashtag violencia de genero podrian hacer mas eficientes nuestros recursos. url", "Protocolos de acompanamiento que permitan reducir la hashtag violencia de genero podrian hacer mas eficientes nuestros recursos. url"], "2013": [], "2014": ["Ayuda a difundir 0800 8843 @usuario para apoyar mujeres que necesitan informacion o acompanamiento en hashtag abortolegal hashtag abortosinestigma", "Defender hashtag aborto legal no es defender a las mujeres, es condenarlas. Necesitan acompanamiento, no falsas soluciones rapidas @usuario", "Agradezco el acompanamiento del Pdte @usuario, del @usuario y del Dr. @usuario en este transitar hacia la hashtag igualdad url", "En hashtag igualdad te ofrecemos orientacion y acomp     const selector = document.getElementById("selector");

    Object.keys(DATA).forEach(word => {

        const option = document.createElement("option");

        option.value = word;

        option.text = word;

        selector.appendChild(option);

    });

    function update(word) {

        Plotly.newPlot(

            "chart",

            [{
                x: DATA[word]["years"],
                y: DATA[word]["values"],
                mode: "lines+markers",
                type: "scatter"
            }],

            {
                title: word,
                height: 500
            }

        );

        const examplesDiv = document.getElementById("examples");

        examplesDiv.innerHTML = "";

        const yearlyExamples = DATA[word]["examples"];

        Object.keys(yearlyExamples).forEach(year => {

            const block = document.createElement("div");

            block.className = "year";

            let html = `<h2>${year}</h2>`;

            const tweets = yearlyExamples[year];

            if (tweets.length === 0) {

                html += "<p>No examples.</p>";

            } else {

                tweets.forEach(tweet => {

                    html += `
                        <div class="tweet">
                            • ${tweet}
                        </div>
                    `;

                });

            }

            block.innerHTML = html;

            examplesDiv.appendChild(block);

        });

    }

    selector.addEventListener(
        "change",
        function() {
            update(this.value);
        }
    );

    update(Object.keys(DATA)[0]);

    </script>
