<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Duplicate Image Gallery</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    background: #1c1c1e;
    color: #eee;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  .card {
    background: #2c2c2e;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .card:hover {
    transform: scale(1.03);
  }
  .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
  }
  .card .info {
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.4;
  }
  .card .info .fname {
    color: #fff;
    word-break: break-all;
  }
  .card .info .count {
    color: #ff9f0a;
    font-weight: 600;
  }
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  .lightbox.open {
    display: flex;
  }
  .lightbox img {
    max-width: 90vw;
    max-height: 78vh;
    object-fit: contain;
    border-radius: 6px;
  }
  .lightbox .caption {
    color: #ddd;
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    max-width: 80vw;
  }
  .lightbox .caption .others {
    color: #999;
    font-size: 12px;
    margin-top: 6px;
    max-height: 80px;
    overflow-y: auto;
  }
  .close-btn {
    position: absolute;
    top: 18px;
    right: 28px;
    color: #fff;
    font-size: 30px;
    cursor: pointer;
    user-select: none;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    color: #fff;
    cursor: pointer;
    user-select: none;
    padding: 10px 16px;
  }
  #prev-btn { left: 10px; }
  #next-btn { right: 10px; }
</style>
</head>

let current = -1;

const grid = document.getElementById('grid');
entries.forEach((e, idx) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="${e.thumb}" loading="lazy">
    <div class="info">
      <div class="fname">${e.filename}</div>
      <div class="count">${e.count} duplicates</div>
    </div>
  `;
  card.addEventListener('click', () => openLightbox(idx));
  grid.appendChild(card);
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxFname = document.getElementById('lightbox-fname');
const lightboxOthers = document.getElementById('lightbox-others');

function openLightbox(idx) {
  current = idx;
  const e = entries[idx];
  lightboxImg.src = e.full;
  lightboxFname.textContent = `${e.filename}  (${e.count} duplicates)`;
  lightboxOthers.textContent = e.others.length ? 'Also duplicated as: ' + e.others.join(', ') : '';
  lightbox.classList.add('open');
}

function closeLightbox() {
  lightbox.classList.remove('open');
}

document.getElementById('close-btn').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (ev) => { if (ev.target === lightbox) closeLightbox(); });

document.getElementById('prev-btn').addEventListener('click', (ev) => {
  ev.stopPropagation();
  openLightbox((current - 1 + entries.length) % entries.length);
});
document.getElementById('next-btn').addEventListener('click', (ev) => {
  ev.stopPropagation();
  openLightbox((current + 1) % entries.length);
});

document.addEventListener('keydown', (ev) => {
  if (!lightbox.classList.contains('open')) return;
  if (ev.key === 'Escape') closeLightbox();
  if (ev.key === 'ArrowRight') openLightbox((current + 1) % entries.length);
  if (ev.key === 'ArrowLeft') openLightbox((current - 1 + entries.length) % entries.length);
});
</script>
