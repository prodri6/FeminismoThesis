<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>#Feminismo | Thesis Figures</title>

    <style>

        /* ============================================================
           GLOBAL STYLING
           ============================================================ */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #f5f6f8;
            color: #263238;
        }


        /* ============================================================
           LANDING PAGE
           ============================================================ */

        #landing-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 30px;
            background:
                radial-gradient(circle at top left, rgba(72, 101, 129, 0.10), transparent 35%),
                radial-gradient(circle at bottom right, rgba(155, 89, 116, 0.08), transparent 35%),
                #f7f7f6;
        }

        .title-page {
            width: min(900px, 100%);
            text-align: center;
            padding: 65px 60px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #e4e5e7;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .title-page .discipline {
            margin-bottom: 35px;
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #68727b;
        }

        .title-page h1 {
            margin: 0 auto 28px;
            max-width: 780px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 400;
            line-height: 1.2;
            color: #273746;
        }

        .title-page .author {
            margin: 0 0 45px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.15rem;
            color: #53616c;
        }

        .title-page .details {
            margin: 0 auto;
            max-width: 650px;
            color: #59636b;
            font-size: 0.92rem;
            line-height: 1.85;
        }

        .title-page .details strong {
            color: #34444f;
            font-weight: 600;
        }

        .title-page .copyright {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #8a9196;
        }

        .enter-button {
            margin-top: 45px;
            padding: 13px 28px;
            border: 1px solid #354b5c;
            background: #354b5c;
            color: white;
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .enter-button:hover {
            background: #253746;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }


        /* ============================================================
           MAIN FIGURE APPLICATION
           ============================================================ */

        #app {
            display: none;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        #app.visible {
            display: flex;
        }


        /* ============================================================
           SIDEBAR
           ============================================================ */

        #sidebar {
            width: 310px;
            min-width: 310px;
            height: 100vh;
            overflow-y: auto;
            background: #273746;
            color: white;
            border-right: 1px solid #d9dde0;
            display: flex;
            flex-direction: column;
        }

        #sidebar-header {
            padding: 24px 22px 20px;
            background: #202f3b;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        #sidebar-header h2 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.35rem;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        #sidebar-header p {
            margin: 7px 0 0;
            color: #aeb9c1;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #buttons-container {
            padding-bottom: 20px;
        }


        /* ============================================================
           CHAPTER HEADERS
           ============================================================ */

        .chapter-header {
            padding: 18px 20px 9px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.72);
            cursor: default;
        }

        .chapter-header:first-child {
            padding-top: 22px;
        }


        /* ============================================================
           FIGURE NAVIGATION BUTTONS
           ============================================================ */

        .nav-btn {
            width: 100%;
            padding: 10px 18px 10px 22px;
            border: none;
            border-left: 4px solid transparent;
            background: transparent;
            color: #e7ebee;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.78rem;
            line-height: 1.35;
            transition:
                background-color 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.07);
        }

        .nav-btn.active {
            color: white;
            background: rgba(255,255,255,0.12);
            font-weight: 600;
        }

        /* Chapter 3 colour */
        .nav-btn.chapter-3.active,
        .nav-btn.chapter-3:hover {
            border-left-color: #8e6f9e;
        }

        /* Chapter 4 colour */
        .nav-btn.chapter-4.active,
        .nav-btn.chapter-4:hover {
            border-left-color: #628c91;
        }

        /* Chapter 5 colour */
        .nav-btn.chapter-5.active,
        .nav-btn.chapter-5:hover {
            border-left-color: #b0835d;
        }


        /* ============================================================
           MAIN CONTENT
           ============================================================ */

        #main-content {
            flex: 1;
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f3f4f5;
        }


        /* ============================================================
           FIGURE INFORMATION PANEL
           ============================================================ */

        #figure-info {
            flex-shrink: 0;
            padding: 19px 28px 17px;
            background: white;
            border-bottom: 1px solid #dfe2e5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        #figure-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 7px;
        }

        #chapter-label {
            display: inline-block;
            padding: 4px 9px;
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: white;
            border-radius: 3px;
        }

        #chapter-label.chapter-3 {
            background: #8e6f9e;
        }

        #chapter-label.chapter-4 {
            background: #628c91;
        }

        #chapter-label.chapter-5 {
            background: #b0835d;
        }

        #figure-page {
            color: #8a9298;
            font-size: 0.74rem;
        }

        #fig-title {
            margin: 0 0 6px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.25rem;
            font-weight: 400;
            line-height: 1.3;
            color: #2d3e4a;
        }

        #fig-caption {
            margin: 0;
            max-width: 1200px;
            color: #68737b;
            font-size: 0.82rem;
            line-height: 1.55;
        }


        /* ============================================================
           VARIANT TABS
           ONLY FIGURES 10 AND 11 USE THESE
           ============================================================ */

        #variant-tabs {
            display: none;
            margin-top: 13px;
            gap: 6px;
        }

        .variant-btn {
            padding: 7px 15px;
            border: 1px solid #cbd1d5;
            border-radius: 3px;
            background: #f1f3f4;
            color: #53616b;
            font-family: inherit;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .variant-btn:hover {
            background: #e6e9eb;
        }

        .variant-btn.active-variant {
            background: #354b5c;
            border-color: #354b5c;
            color: white;
        }


        /* ============================================================
           VIEWER
           ============================================================ */

        #viewer-container {
            position: relative;
            flex: 1;
            min-height: 0;
            margin: 16px;
            overflow: hidden;
            background: white;
            border: 1px solid #dfe2e5;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        #viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
        }


        /* ============================================================
           IMAGE ZOOM CONTROLS
           ============================================================ */

        #zoom-controls {
            position: absolute;
            right: 16px;
            bottom: 16px;
            display: none;
            align-items: center;
            gap: 4px;
            padding: 5px;
            background: rgba(255,255,255,0.96);
            border: 1px solid #d8dde0;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            z-index: 10;
        }

        .zoom-btn {
            width: 32px;
            height: 30px;
            border: none;
            background: transparent;
            color: #354b5c;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .zoom-btn:hover {
            background: #eef0f2;
        }

        #zoom-level {
            min-width: 48px;
            text-align: center;
            color: #64717a;
            font-size: 0.68rem;
            font-weight: 600;
        }


        /* ============================================================
           IMAGE VIEWER
           ============================================================ */

        #image-viewer {
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: auto;
            background: white;
        }

        #image-viewer img {
            display: block;
            max-width: none;
            max-height: none;
            object-fit: contain;
            transform-origin: center center;
        }


        /* ============================================================
           FOOTER
           ============================================================ */

        #footer {
            flex-shrink: 0;
            height: 34px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #273746;
            color: #aeb9c1;
            font-size: 0.67rem;
        }

        #footer strong {
            color: #e0e5e8;
            font-weight: 500;
        }

        #back-to-title {
            border: none;
            background: none;
            color: #aeb9c1;
            font-family: inherit;
            font-size: 0.67rem;
            cursor: pointer;
            padding: 0;
        }

        #back-to-title:hover {
            color: white;
        }


        /* ============================================================
           RESPONSIVE DESIGN
           ============================================================ */

        @media (max-width: 800px) {

            #sidebar {
                width: 235px;
                min-width: 235px;
            }

            #figure-info {
                padding: 15px 18px;
            }

            #viewer-container {
                margin: 10px;
            }

            .title-page {
                padding: 45px 30px;
            }
        }

        @media (max-width: 600px) {

            #app {
                flex-direction: column;
            }

            #sidebar {
                width: 100%;
                min-width: 0;
                height: 220px;
            }

            #sidebar-header {
                padding: 14px 18px;
            }

            #buttons-container {
                display: flex;
                overflow-x: auto;
                padding-bottom: 5px;
            }

            .chapter-header {
                min-width: 110px;
                padding: 14px 10px;
            }

            .nav-btn {
                min-width: 150px;
                border-left: none;
                border-bottom: 3px solid transparent;
            }

            .nav-btn.chapter-3.active {
                border-bottom-color: #8e6f9e;
            }

            .nav-btn.chapter-4.active {
                border-bottom-color: #628c91;
            }

            .nav-btn.chapter-5.active {
                border-bottom-color: #b0835d;
            }

            #main-content {
                height: calc(100vh - 220px);
            }

            #fig-title {
                font-size: 1.05rem;
            }

            #fig-caption {
                font-size: 0.76rem;
            }
        }

    </style>
</head>


<body>


    <!-- ============================================================
         LANDING PAGE
         ============================================================ -->

    <section id="landing-page">

        <div class="title-page">

            <div class="discipline">
                Graduate Program in Hispanic Studies
            </div>

            <h1>
                #Feminismo: An exploration of Cyberfeminism in the Digital Hispanosphere
            </h1>

            <p class="author">
                Pilar del Carmen Rodríguez Mata
            </p>
